name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: info check
        run: |
          moon info
          git diff --exit-code

      - name: moon test
        run: moon test --target all

      - name: query tests
        run: moon test query_tests --target all

      - name: setup e2e fixtures
        run: node scripts/setup-e2e.mjs

      - name: create e2e temp directory
        shell: bash
        env:
          E2E_TEMP: ${{ runner.temp }}/moongrep-e2e
        run: |
          mkdir -p "$E2E_TEMP"
          echo "E2E_TEMP=$E2E_TEMP" >> "$GITHUB_ENV"

      - name: common e2e tests
        run: moonx moonbit-community/mooncram@0.0.6 test e2etests/common

      - name: unix e2e tests
        if: runner.os != 'Windows'
        run: moonx moonbit-community/mooncram@0.0.6 test e2etests/unix

      - name: windows e2e tests
        if: runner.os == 'Windows'
        run: moonx moonbit-community/mooncram@0.0.6 test e2etests/windows
