name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: info check
        run: |
          moon info
          git diff --exit-code

      - name: moon test
        run: moon test --target all

      - name: e2e test
        run: node scripts/e2e.mjs test
