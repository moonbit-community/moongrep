name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: info check
        run: |
          moon info
          git diff --exit-code

      - name: moon test
        run: moon test --target all

      - name: e2e test
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/e2e.sh test

      - name: Windows wasm CLI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          moon build --release --target wasm
          $env:NO_COLOR = '1'
          $artifact = Join-Path $PWD "_build\wasm\release\build\moongrep.wasm"
          $output = @(& moonrun $artifact -- scan --rules '.\e2etests\rules\structural' --exclude 'IGNORED\' --exclude '.\testdata\exclude-dirs\GENERATED\' --exclude 'EXCLUDED.MBT' '.\testdata\exclude-dirs')
          if ($LASTEXITCODE -ne 0) {
            $output | ForEach-Object { Write-Output $_ }
            throw "moongrep smoke test failed with exit code $LASTEXITCODE"
          }
          $output | ForEach-Object { Write-Output $_ }
          $findings = @($output | Where-Object { $_ -match '\.mbt:\d+:\d+-\d+:\d+$' })
          $expected = 'testdata\exclude-dirs\hit.mbt:1:13-1:21'
          if ($findings.Count -ne 1 -or $findings[0] -ne $expected) {
            throw "expected only '$expected', got: $($findings -join '; ')"
          }
