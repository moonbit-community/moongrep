package: moonbitlang
description: |
  Found inspect(), debug_inspect(), or json_inspect() snapshots whose expected value is true or false.
  Prefer assert_true(...) or assert_false(...) for boolean checks.

patterns:
  - shape: |
      inspect(__, content="true")
  - shape: |
      debug_inspect(__, content="true")
  - shape: |
      json_inspect(__, content=true)
  - shape: |
      inspect(__, content="false")
  - shape: |
      debug_inspect(__, content="false")
  - shape: |
      json_inspect(__, content=false)
