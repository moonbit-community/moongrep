id: match_single_case
description: |
  Match handles one constructor and otherwise does nothing.
  Prefer if + is, keeping the complete constructor pattern and branch body.

# Only unguarded constructor arms and explicit unit fallbacks are covered.
# A bare {} in a match arm can be an empty Map, so it is not necessarily Unit.
patterns:
  - shape: |
      match $(value:exp) {
        $(Ctor:id) => $(body:exp)
        _ => ()
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)($$$args) => $(body:exp)
        _ => ()
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)($$$args, ..) => $(body:exp)
        _ => ()
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id) => $(body:exp)
        _ => { () }
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)($$$args) => $(body:exp)
        _ => { () }
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)($$$args, ..) => $(body:exp)
        _ => { () }
      }
