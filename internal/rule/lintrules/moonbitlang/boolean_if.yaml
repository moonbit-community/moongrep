id: boolean_if
description: |
  Both if branches return opposite boolean literals.
  Use the condition directly, or negate it when the true branch returns false.

# Only accept condition roots that cannot expose pattern bindings to a caller.
# In particular, is/regex matches and general && chains are left alone.
patterns:
  - shape: if __TARGET__ { true } else { false }
    then:
      patterns:
        - shape: $(condition:id)
        - shape: $(condition:const)
        - shape: $_($$$args)
        - shape: $_.$(method:id)($$$args)
        - shape: $_.$(field:id)
        - shape: $_[$_]
        - shape: $_ == $_
        - shape: $_ != $_
        - shape: $_ < $_
        - shape: $_ <= $_
        - shape: $_ > $_
        - shape: $_ >= $_
        - shape: '!$_'
        - shape: $_ || $_
        - shape: $(left:id) && $(right:id)
      patterns-not:
        - shape: $_
  - shape: if __TARGET__ { false } else { true }
    then:
      patterns:
        - shape: $(condition:id)
        - shape: $(condition:const)
        - shape: $_($$$args)
        - shape: $_.$(method:id)($$$args)
        - shape: $_.$(field:id)
        - shape: $_[$_]
        - shape: $_ == $_
        - shape: $_ != $_
        - shape: $_ < $_
        - shape: $_ <= $_
        - shape: $_ > $_
        - shape: $_ >= $_
        - shape: '!$_'
        - shape: $_ || $_
        - shape: $(left:id) && $(right:id)
      patterns-not:
        - shape: $_
