id: boolean_match
description: |
  Match returns opposite boolean literals for a pattern and its wildcard fallback.
  Use value is pattern, or !(value is pattern) when the matching branch returns false.

# Keep patterns binder-free: literals and constructors with wildcard payloads.
patterns:
  - shape: |
      match $(value:exp) {
        $(Ctor:id) => true
        _ => false
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)(_) => true
        _ => false
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)(_, _) => true
        _ => false
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)(..) => true
        _ => false
      }
  - shape: |
      match $(value:exp) {
        $(pattern:const) => true
        _ => false
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id) => false
        _ => true
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)(_) => false
        _ => true
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)(_, _) => false
        _ => true
      }
  - shape: |
      match $(value:exp) {
        $(Ctor:id)(..) => false
        _ => true
      }
  - shape: |
      match $(value:exp) {
        $(pattern:const) => false
        _ => true
      }
