id: cstyle_forward_simple_forloop
description: |
  C-style forward for loops that can be rewritten as simple for-in loops.

patterns:
  - shape: |
      for $(counter:id) = $(start:exp); $(counter:id) < $(limit:exp); $(counter:id) = $(counter:id) + 1 {
        __TARGET__
      }
    then:
      patterns-not:
        - shape: $(counter:id)
