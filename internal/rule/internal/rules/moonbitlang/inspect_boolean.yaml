id: inspect_boolean
description: |
  Found inspect(), debug_inspect(), or json_inspect() snapshots whose expected value is true or false.
  Prefer assert_true(...) or assert_false(...) for boolean checks.

patterns:
  - shape: |
      inspect($_, content="true")
  - shape: |
      debug_inspect($_, content="true")
  - shape: |
      json_inspect($_, content=true)
  - shape: |
      inspect($_, content="false")
  - shape: |
      debug_inspect($_, content="false")
  - shape: |
      json_inspect($_, content=false)
