id: catch_all
description: |
  Single catch arm handles every error, which can hide unexpected failures.
  Prefer matching only the specific error cases that can be recovered from.

inside-toplevel:
  # TODO: support matching params
  - shape: |
      async fn $f(_) -> $T {
        __TARGET__
      }

patterns:
  - shape: |
      try $_ catch {
        _ => $_
      }
  - shape: |
      $_ catch {
        _ => $_
      }
  - shape: |
      try $_ catch {
        $(allerror:id) => $_
      }
  - shape: |
      $_ catch {
        $(allerror:id) => $_
      }
