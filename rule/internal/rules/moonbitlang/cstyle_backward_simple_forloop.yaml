id: cstyle_backward_simple_forloop
description: |
  C-style backward for loops that can be rewritten as simple for-in loops.

inside-expr:
  - shape: |
      for $(counter:id) = $(start:exp); $(counter:id) > $(limit:exp); $(counter:id) = $(counter:id) - 1 {
        __TARGET__
      }
patterns-not:
  - shape: $(counter:id)
